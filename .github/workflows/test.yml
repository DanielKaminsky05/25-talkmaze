name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # allow manual runs from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # cancel a queued run if a newer commit arrives

jobs:
  # ── Unit tests ──────────────────────────────────────────────────────────────
  # Fast, no Docker. Runs in ~10s. Catches pure-logic regressions on every push.

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # ── Integration tests ────────────────────────────────────────────────────────
  # Requires Docker (pre-installed on ubuntu-latest). Spins up a local Supabase
  # stack, resets the schema, seeds via factories, then tears down.
  # Runs on PRs and pushes to main/dev. Skipped on draft PRs.

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npx supabase is the CLI binary bundled with the npm package (supabase ^2.100.1).
      # It downloads the linux-amd64 binary on first install. No separate setup action needed.
      - name: Start Supabase
        run: npx supabase start

      # Extract the locally-generated keys from supabase status output and write
      # them to GITHUB_ENV so subsequent steps and the test runner see them.
      # These are NOT secrets — they are ephemeral, generated by the local CLI,
      # and valid only for the duration of this job.
      - name: Export Supabase credentials
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          STATUS=$(npx supabase status 2>/dev/null)
          ANON_KEY=$(echo "$STATUS" | grep 'anon key' | awk '{print $NF}')
          SERVICE_KEY=$(echo "$STATUS" | grep 'service_role key' | awk '{print $NF}')
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: npm run test:integration
        env:
          # Supabase vars are already in env from the previous step.
          # Stripe uses dummy values — routes that reach Stripe are mocked in tests.
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_test_talkmaze_integration
          # Tell the test global-setup to skip trying to read .env.test from disk.
          # (The file is gitignored; credentials come from GITHUB_ENV instead.)
          CI: true
